plugins { id 'com.android.application' }

android {
    namespace 'io.github.jy41319.bandtrail'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.github.jy41319.bandtrail'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.1.1-alpha'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('BANDTRAIL_KEYSTORE')) {
                storeFile file(System.getenv('BANDTRAIL_KEYSTORE'))
                storePassword System.getenv('BANDTRAIL_STORE_PASSWORD')
                keyAlias 'bandtrail'
                keyPassword System.getenv('BANDTRAIL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('BANDTRAIL_KEYSTORE')) signingConfig signingConfigs.release
        }
        debug { applicationIdSuffix '.debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
